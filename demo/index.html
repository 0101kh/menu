<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FOODBOX — меню</title>
<style>
  :root{--paper:#FBF7F1;--card:#FFFFFF;--ink:#1C1714;--muted:#7A6F64;--accent:#E0341E;--accent-deep:#A8240F;
    --amber:#F2A93B;--line:#E7DDCD;--shadow:0 8px 30px rgba(28,23,20,.12);--col:600px;
    --max:#3A6DF0;--tg:#2AABEE;--wa:#25D366;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.45;padding-bottom:120px}
  .wrap{max-width:var(--col);margin:0 auto;position:relative}
  header{background:var(--ink);color:var(--paper);padding:22px 20px 18px;border-bottom:4px solid var(--accent)}
  .brand{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
  .brand .dot{color:var(--accent)}
  .tagline{font-size:13px;color:#C9BEB0;margin-top:6px}
  .info{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;font-size:12.5px;color:#E4D9CB}
  .info span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:999px}
  nav{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .cats{display:flex;gap:8px;padding:12px 20px;width:max-content}
  .cat{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:.15s}
  .cat.active{background:var(--accent);border-color:var(--accent);color:#fff}
  section{padding:22px 20px 4px;scroll-margin-top:62px}
  .sec-title{font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start}
  .item-img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
  .item-body{flex:1;min-width:0}
  .item-name{font-size:16px;font-weight:700;margin:0}
  .item-desc{font-size:13px;color:var(--muted);margin:4px 0 0}
  .item-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .price{font-weight:800;font-size:14px;background:var(--amber);color:#3a2a08;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .add{width:40px;height:40px;border-radius:12px;border:none;cursor:pointer;background:var(--accent);color:#fff;font-size:24px;font-weight:600;display:grid;place-items:center;line-height:1;transition:.12s}
  .add:active{transform:scale(.92);background:var(--accent-deep)}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--accent);border-radius:12px;overflow:hidden}
  .stepper button{width:36px;height:40px;border:none;background:var(--card);color:var(--accent);font-size:20px;font-weight:700;cursor:pointer}
  .stepper button:active{background:#fbe9e6}
  .stepper .q{min-width:30px;text-align:center;font-weight:800;font-size:15px}
  .tray{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:var(--col);margin:0 auto;padding:0 14px 14px;transform:translateY(140%);transition:transform .25s ease}
  .tray.show{transform:translateY(0)}
  .tray-btn{width:100%;background:var(--accent);color:#fff;border:none;cursor:pointer;border-radius:16px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);font-size:16px}
  .tray-btn:active{background:var(--accent-deep)}
  .tray-left{display:flex;align-items:center;gap:10px;font-weight:600}
  .tray-count{background:#fff;color:var(--accent);font-weight:800;font-size:13px;min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
  .tray-total{font-weight:800}
  .overlay{position:fixed;inset:0;background:rgba(28,23,20,.5);z-index:50;opacity:0;pointer-events:none;transition:.2s}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:var(--col);margin:0 auto;background:var(--paper);border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .sheet.show{transform:translateY(0)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
  .sheet-head h2{margin:0;font-size:19px;font-weight:800}
  .close{background:none;border:none;font-size:26px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
  .sheet-scroll{overflow-y:auto;padding:0 20px;flex:1}
  .ticket{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:16px;margin-bottom:16px}
  .tear{border:none;border-top:2px dashed var(--line);margin:12px 0}
  .t-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:7px 0}
  .t-row .t-name{flex:1}
  .t-row .t-q{color:var(--accent);font-weight:800;margin-right:8px}
  .t-mini{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:8px}
  .t-mini button{width:28px;height:28px;border:none;background:var(--paper);color:var(--accent);font-weight:700;cursor:pointer;font-size:16px}
  .t-sum{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:3px 0}
  .t-total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding-top:6px}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:15px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .field .req{color:var(--accent)}
  .field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;background:var(--card);color:var(--ink);transition:.15s}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:60px}
  .field.invalid input{border-color:var(--accent);background:#fdeeec}
  .err{color:var(--accent);font-size:13px;margin:8px 0 2px;display:none;font-weight:600}
  .err.show{display:block}
  /* экран после оформления */
  .done-h{font-size:18px;font-weight:800;margin:4px 0 2px;color:#1a9d4d}
  .done-sub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
  .order-box{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:14px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;color:var(--ink);margin-bottom:10px}
  .copy-btn{width:100%;background:var(--ink);color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:16px}
  .copy-btn:active{opacity:.85}
  .ch-title{font-size:12.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .channels{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
  .ch{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:12px;font-weight:800;font-size:15px;border:none;cursor:pointer;text-decoration:none;color:#fff}
  .ch:active{opacity:.9}
  .ch-max{background:var(--max)}
  .ch-tg{background:var(--tg)}
  .ch-wa{background:var(--wa)}
  .sheet-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
  .send{width:100%;background:var(--accent);color:#fff;border:none;cursor:pointer;border-radius:14px;padding:16px;font-size:16.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
  .send:active{background:var(--accent-deep)}
  .send:disabled{background:#cdd6cf;cursor:not-allowed}
  .foot-note{text-align:center;font-size:11.5px;color:var(--muted);margin:9px 0 0}
  @media (prefers-reduced-motion: reduce){.tray,.sheet,.overlay{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brandName">FOODBOX<span class="dot">.</span></div>
    <div class="tagline" id="tagline"></div>
    <div class="info"><span id="infoTime"></span><span id="infoDelivery"></span><span id="infoMin"></span></div>
  </header>
  <nav><div class="cats" id="cats"></div></nav>
  <main id="menu"></main>
</div>
<div class="tray" id="tray">
  <button class="tray-btn" type="button" onclick="openSheet()">
    <span class="tray-left"><span class="tray-count" id="trayCount">0</span>Посмотреть заказ</span>
    <span class="tray-total" id="trayTotal">0</span></button>
</div>
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Ваш заказ">
  <div class="sheet-head"><h2 id="sheetTitle">Ваш заказ</h2><button class="close" type="button" onclick="closeSheet()" aria-label="Закрыть">×</button></div>
  <div class="sheet-scroll" id="sheetScroll">
    <div class="ticket" id="ticket"></div>
    <div id="formBlock">
      <div class="field" id="f-name"><label>Имя <span class="req">*</span></label><input id="inName" type="text" placeholder="Как вас зовут" autocomplete="name"></div>
      <div class="field" id="f-phone"><label>Телефон <span class="req">*</span></label><input id="inPhone" type="tel" inputmode="tel" placeholder="+7 ___ ___ __ __" autocomplete="tel"></div>
      <div class="field" id="f-addr"><label>Адрес доставки <span class="req">*</span></label><input id="inAddr" type="text" placeholder="Улица, дом, квартира, этаж" autocomplete="street-address"></div>
      <div class="field"><label>Комментарий</label><textarea id="inNote" placeholder="Без лука, позвонить за 10 минут и т.д."></textarea></div>
      <div class="err" id="errBox"></div>
    </div>
    <div id="resultBlock" style="display:none">
      <div class="done-h">✓ Заказ собран и скопирован</div>
      <p class="done-sub">Открой мессенджер ресторана и вставь заказ (долгое нажатие в поле ввода → «Вставить»), затем отправь.</p>
      <div class="order-box" id="orderText"></div>
      <button class="copy-btn" type="button" id="copyBtn">📋 Скопировать заказ ещё раз</button>
      <div class="ch-title">Открыть чат ресторана:</div>
      <div class="channels" id="channels"></div>
    </div>
  </div>
  <div class="sheet-foot">
    <button class="send" id="mainBtn" type="button">Оформить заказ</button>
    <div class="foot-note" id="footNote">Соберём заказ и скопируем — останется вставить в чат ресторана</div>
  </div>
</div>
<script>
const CONFIG = {
  "name": "FOODBOX",
  "tagline": "Пицца • Бургеры • Доставка за 40 минут",
  "max": "https://max.ru/u/ВАШ_ХЕШ",
  "telegram": "",
  "whatsapp": "79991234567",
  "currency": "₽",
  "deliveryFee": 150,
  "minOrder": 500,
  "workTime": "30–45 мин"
};

const MENU = [
  { "cat": "Пицца 30 см", "items": [
    { "id": "p1", "name": "Пепперони", "desc": "Острая пепперони, моцарелла, томатный соус", "price": 590, "img": "" },
    { "id": "p2", "name": "Маргарита", "desc": "Томаты, моцарелла, свежий базилик", "price": 520, "img": "" },
    { "id": "p3", "name": "Четыре сыра", "desc": "Моцарелла, чеддер, пармезан, дор-блю", "price": 690, "img": "" },
    { "id": "p4", "name": "Мясная", "desc": "Пепперони, бекон, ветчина, курица", "price": 720, "img": "" },
    { "id": "p5", "name": "Гавайская", "desc": "Курица, ананас, моцарелла", "price": 610, "img": "" },
    { "id": "p6", "name": "Барбекю", "desc": "Курица, красный лук, соус барбекю", "price": 670, "img": "" }
  ]},
  { "cat": "Бургеры", "items": [
    { "id": "b1", "name": "Чизбургер", "desc": "Говядина, чеддер, фирменный соус, лук", "price": 320, "img": "" },
    { "id": "b2", "name": "Двойной «Биф»", "desc": "Две котлеты, бекон, двойной сыр", "price": 490, "img": "" },
    { "id": "b3", "name": "Куриный бургер", "desc": "Хрустящая курица, салат, соус", "price": 360, "img": "" },
    { "id": "b4", "name": "Острый «Чили»", "desc": "Говядина, халапеньо, острый соус", "price": 410, "img": "" },
    { "id": "b5", "name": "Вегги бургер", "desc": "Котлета из нута, овощи, соус тахини", "price": 350, "img": "" }
  ]},
  { "cat": "Закуски", "items": [
    { "id": "s1", "name": "Картофель фри", "desc": "Большая порция", "price": 180, "img": "" },
    { "id": "s2", "name": "Картофель по-деревенски", "desc": "С чесноком и паприкой", "price": 200, "img": "" },
    { "id": "s3", "name": "Наггетсы, 6 шт", "desc": "С соусом на выбор", "price": 220, "img": "" },
    { "id": "s4", "name": "Луковые кольца, 8 шт", "desc": "Хрустящие, в панировке", "price": 210, "img": "" },
    { "id": "s5", "name": "Крылышки BBQ, 6 шт", "desc": "В соусе барбекю", "price": 320, "img": "" },
    { "id": "s6", "name": "Сырные палочки, 5 шт", "desc": "Моцарелла, соус маринара", "price": 260, "img": "" }
  ]},
  { "cat": "Напитки", "items": [
    { "id": "d1", "name": "Кола 0.5", "desc": "", "price": 120, "img": "" },
    { "id": "d2", "name": "Спрайт 0.5", "desc": "", "price": 120, "img": "" },
    { "id": "d3", "name": "Лимонад домашний", "desc": "Мята-лайм, 0.4", "price": 160, "img": "" },
    { "id": "d4", "name": "Морс ягодный", "desc": "Клюква-смородина, 0.4", "price": 140, "img": "" },
    { "id": "d5", "name": "Капучино", "desc": "На выбор молоко", "price": 150, "img": "" },
    { "id": "d6", "name": "Вода 0.5", "desc": "Без газа / с газом", "price": 80, "img": "" }
  ]}
];

const cart={};const byId={};
MENU.forEach(s=>s.items.forEach(i=>byId[i.id]=i));
const cur=CONFIG.currency;const money=n=>n.toLocaleString("ru-RU")+" "+cur;
const mainBtn=document.getElementById("mainBtn");
document.getElementById("brandName").innerHTML=CONFIG.name+'<span class="dot">.</span>';
document.getElementById("tagline").textContent=CONFIG.tagline;
document.getElementById("infoTime").textContent="⏱ "+CONFIG.workTime;
document.getElementById("infoDelivery").textContent=CONFIG.deliveryFee>0?"🛵 Доставка "+money(CONFIG.deliveryFee):"🛵 Доставка бесплатно";
const minEl=document.getElementById("infoMin");
if(CONFIG.minOrder>0){minEl.textContent="🧾 Минимум "+money(CONFIG.minOrder)}else{minEl.style.display="none"}
const catsEl=document.getElementById("cats");
MENU.forEach((s,idx)=>{const b=document.createElement("button");b.className="cat"+(idx===0?" active":"");
  b.textContent=s.cat;b.onclick=()=>{document.getElementById("sec-"+idx).scrollIntoView({behavior:"smooth",block:"start"})};catsEl.appendChild(b)});
const menuEl=document.getElementById("menu");
MENU.forEach((s,idx)=>{const sec=document.createElement("section");sec.id="sec-"+idx;
  sec.innerHTML='<h2 class="sec-title">'+s.cat+'</h2>';
  s.items.forEach(it=>{const row=document.createElement("div");row.className="item";
    row.innerHTML=(it.img?'<img class="item-img" src="'+it.img+'" alt="">':'')+
      '<div class="item-body"><p class="item-name">'+it.name+'</p>'+(it.desc?'<p class="item-desc">'+it.desc+'</p>':'')+'</div>'+
      '<div class="item-side"><span class="price">'+money(it.price)+'</span><div id="ctrl-'+it.id+'"></div></div>';
    sec.appendChild(row);menuEl.appendChild(sec)})});
const catBtns=[...catsEl.children];
const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const i=+e.target.id.split("-")[1];
  catBtns.forEach((b,k)=>b.classList.toggle("active",k===i))}})},{rootMargin:"-55% 0px -42% 0px"});
MENU.forEach((s,idx)=>obs.observe(document.getElementById("sec-"+idx)));
function renderCtrl(id){const el=document.getElementById("ctrl-"+id);const q=cart[id]||0;
  if(q===0){el.innerHTML='<button class="add" type="button" aria-label="Добавить">+</button>';el.firstChild.onclick=()=>change(id,1)}
  else{el.innerHTML='<div class="stepper"><button type="button" aria-label="Убрать">−</button><span class="q">'+q+'</span><button type="button" aria-label="Добавить">+</button></div>';
    const m=el.firstChild.children[0],p=el.firstChild.children[2];m.onclick=()=>change(id,-1);p.onclick=()=>change(id,1)}}
MENU.forEach(s=>s.items.forEach(i=>renderCtrl(i.id)));
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCtrl(id);updateTray();
  if(document.getElementById("sheet").classList.contains("show")&&document.getElementById("resultBlock").style.display==="none")renderTicket()}
function subtotal(){return Object.entries(cart).reduce((s,[id,q])=>s+byId[id].price*q,0)}
function count(){return Object.values(cart).reduce((s,q)=>s+q,0)}
function updateTray(){const n=count();document.getElementById("trayCount").textContent=n;
  document.getElementById("trayTotal").textContent=money(subtotal());document.getElementById("tray").classList.toggle("show",n>0)}
function openSheet(){backToCart();renderTicket();document.getElementById("overlay").classList.add("show");
  document.getElementById("sheet").classList.add("show");document.body.style.overflow="hidden"}
function closeSheet(){document.getElementById("overlay").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");document.body.style.overflow=""}
function renderTicket(){const t=document.getElementById("ticket");const ids=Object.keys(cart);
  if(ids.length===0){t.innerHTML='<div class="empty">Корзина пуста.<br>Выбери что-нибудь вкусное 🍔</div>';
    document.getElementById("formBlock").style.display="none";mainBtn.disabled=true;return}
  document.getElementById("formBlock").style.display="";mainBtn.disabled=false;
  let rows="";ids.forEach(id=>{const it=byId[id],q=cart[id];
    rows+='<div class="t-row"><span class="t-name"><span class="t-q">'+q+'×</span>'+it.name+'</span>'+
      '<span>'+money(it.price*q)+'</span><span class="t-mini"><button type="button" onclick="change(\''+id+'\',-1)">−</button>'+
      '<button type="button" onclick="change(\''+id+'\',1)">+</button></span></div>'});
  const sub=subtotal(),dlv=CONFIG.deliveryFee||0,total=sub+dlv;
  let sums='<div class="t-sum"><span>Сумма</span><span>'+money(sub)+'</span></div>';
  if(dlv>0)sums+='<div class="t-sum"><span>Доставка</span><span>'+money(dlv)+'</span></div>';
  sums+='<div class="t-total"><span>Итого</span><span>'+money(total)+'</span></div>';
  t.innerHTML='<div class="t-total" style="font-size:13px;letter-spacing:1px;color:var(--accent)">🧾 ЗАКАЗ</div><hr class="tear">'+rows+'<hr class="tear">'+sums}

function buildOrderText(name,phone,addr,note){
  const sub=subtotal(),dlv=CONFIG.deliveryFee||0,total=sub+dlv;let lines=[];
  lines.push("🧾 НОВЫЙ ЗАКАЗ — "+CONFIG.name);lines.push("————————————");
  Object.keys(cart).forEach(id=>{const it=byId[id],q=cart[id];lines.push(q+"× "+it.name+" — "+money(it.price*q))});
  lines.push("————————————");lines.push("Сумма: "+money(sub));
  if(dlv>0)lines.push("Доставка: "+money(dlv));lines.push("ИТОГО: "+money(total));lines.push("");
  lines.push("👤 "+name);lines.push("📞 "+phone);lines.push("📍 "+addr);if(note)lines.push("💬 "+note);
  return lines.join("\n");
}
function copyText(t){try{navigator.clipboard.writeText(t)}catch(e){
  const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy")}catch(_){}document.body.removeChild(ta)}}

function renderChannels(text){
  const c=document.getElementById("channels");c.innerHTML="";const enc=encodeURIComponent(text);
  if(CONFIG.max){const a=document.createElement("a");a.className="ch ch-max";a.href=CONFIG.max;a.target="_blank";a.rel="noopener";
    a.textContent="Открыть МАКС";c.appendChild(a)}
  if(CONFIG.telegram){const u=CONFIG.telegram.replace(/^@/,"");const a=document.createElement("a");a.className="ch ch-tg";
    a.href="https://t.me/"+u;a.target="_blank";a.rel="noopener";a.textContent="Открыть Telegram";c.appendChild(a)}
  if(CONFIG.whatsapp){const a=document.createElement("a");a.className="ch ch-wa";
    a.href="https://wa.me/"+CONFIG.whatsapp+"?text="+enc;a.target="_blank";a.rel="noopener";a.textContent="Открыть WhatsApp";c.appendChild(a)}
}

function orderConfirm(){
  const name=document.getElementById("inName").value.trim();const phone=document.getElementById("inPhone").value.trim();
  const addr=document.getElementById("inAddr").value.trim();const note=document.getElementById("inNote").value.trim();
  ["f-name","f-phone","f-addr"].forEach(f=>document.getElementById(f).classList.remove("invalid"));
  const err=document.getElementById("errBox");err.classList.remove("show");const sub=subtotal();if(sub===0)return;
  if(CONFIG.minOrder>0&&sub<CONFIG.minOrder){err.textContent="Минимальный заказ — "+money(CONFIG.minOrder)+". Добавьте ещё на "+money(CONFIG.minOrder-sub)+".";err.classList.add("show");return}
  let bad=[];if(!name)bad.push("f-name");if(!phone)bad.push("f-phone");if(!addr)bad.push("f-addr");
  if(bad.length){bad.forEach(f=>document.getElementById(f).classList.add("invalid"));
    err.textContent="Заполните имя, телефон и адрес доставки.";err.classList.add("show");
    document.getElementById(bad[0]).scrollIntoView({behavior:"smooth",block:"center"});return}
  const text=buildOrderText(name,phone,addr,note);
  copyText(text);
  document.getElementById("orderText").textContent=text;
  renderChannels(text);
  document.getElementById("ticket").style.display="none";
  document.getElementById("formBlock").style.display="none";
  document.getElementById("resultBlock").style.display="";
  document.getElementById("sheetTitle").textContent="Заказ готов";
  document.getElementById("footNote").textContent="Скопировано. Вставь в чат ресторана и отправь.";
  mainBtn.textContent="← Изменить заказ";mainBtn.onclick=backToCart;
  document.getElementById("sheetScroll").scrollTop=0;
}
function backToCart(){
  document.getElementById("resultBlock").style.display="none";
  document.getElementById("ticket").style.display="";
  document.getElementById("sheetTitle").textContent="Ваш заказ";
  document.getElementById("footNote").textContent="Соберём заказ и скопируем — останется вставить в чат ресторана";
  mainBtn.textContent="Оформить заказ";mainBtn.onclick=orderConfirm;
  renderTicket();
}
document.getElementById("copyBtn").onclick=()=>copyText(document.getElementById("orderText").textContent);
mainBtn.onclick=orderConfirm;
updateTray();
</script>
</body>
</html>
