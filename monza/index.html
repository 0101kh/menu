  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  .brand{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.05;background:var(--brand-grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6.5s linear infinite}

  .brand-sub{font-size:12px;letter-spacing:8px;color:var(--acc-lt);margin-top:7px;display:none}.brand-sub.show{display:block}

  .tagline{font-size:14px;color:var(--muted);margin-top:11px}.tagline.serif{font-family:Georgia,serif;font-style:italic;color:var(--acc-lt)}
  .info{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}

  .halal{position:absolute;top:16px;right:16px;font-size:8.5px;letter-spacing:1px;color:var(--acc-lt);border:1.5px solid var(--accent);border-radius:50%;width:44px;height:44px;display:none;place-items:center;text-align:center;line-height:1.1;background:var(--glow);box-shadow:0 0 16px var(--glow)}

  nav{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.18);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}

  .cats{display:flex;gap:8px;padding:13px 20px;width:max-content}

  .cat.active{background:linear-gradient(135deg,var(--acc-lt),var(--accent));border-color:var(--accent);color:var(--acc-ink);box-shadow:0 4px 16px var(--glow)}

  .sec-title{font-size:18px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 16px;display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--acc-lt),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}

  .item-ph{width:68px;height:68px;border-radius:13px;flex:none;display:grid;place-items:center;background:var(--ph);border:1px solid var(--line)}
  .item-body{flex:1;min-width:0}.item-name{font-size:15.5px;font-weight:700;margin:0;color:var(--ink)}

  .item-side{display:flex;flex-direction:column;align-items:flex-end;gap:11px}
  .price{font-weight:800;font-size:13.5px;background:linear-gradient(135deg,var(--price),var(--price-dk));color:var(--price-ink);padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 12px var(--glow)}
  .add{width:42px;height:42px;border-radius:13px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--acc-lt),var(--accent));color:var(--acc-ink);font-size:25px;font-weight:700;display:grid;place-items:center;line-height:1;transition:.12s;box-shadow:0 4px 14px var(--glow)}

  .stepper{display:flex;align-items:center;border:1.5px solid var(--accent);border-radius:13px;overflow:hidden;background:var(--glow)}

  .tray{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:var(--col);margin:0 auto;padding:0 14px 14px;transform:translateY(150%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}

  .tray-count{background:rgba(0,0,0,.25);color:var(--acc-ink);font-weight:800;font-size:13px;min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:.2s}.overlay.show{opacity:1;pointer-events:auto}

  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}

  .close{background:none;border:none;font-size:26px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
  .sheet-scroll{overflow-y:auto;padding:0 20px;flex:1}
  .ticket{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:16px;margin-bottom:16px}
  .tear{border:none;border-top:1px dashed var(--line);margin:12px 0}
  .t-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:7px 0}.t-row .t-name{flex:1}
  .t-row .t-q{color:var(--accent);font-weight:800;margin-right:8px}
  .t-mini{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:8px}
  .t-mini button{width:28px;height:28px;border:none;background:var(--glow);color:var(--accent);font-weight:700;cursor:pointer;font-size:16px}
  .t-sum{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:3px 0}
  .t-total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding-top:6px;color:var(--ink)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:15px}
  .field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--acc-lt)}.field .req{color:var(--accent)}
  .field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;background:rgba(0,0,0,.12);color:var(--ink)}

  .err{color:var(--accent);font-size:13px;margin:8px 0 2px;display:none;font-weight:600}.err.show{display:block}
  .done-h{font-size:18px;font-weight:800;margin:4px 0 2px;color:var(--acc-lt)}.done-sub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
  .order-box{background:rgba(0,0,0,.18);border:1px dashed var(--line);border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;color:var(--ink);margin-bottom:10px}
  .copy-btn{width:100%;background:transparent;color:var(--acc-lt);border:1.5px solid var(--accent);border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:16px}
  .ch-title{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .channels{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
  .ch{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:12px;font-weight:800;font-size:15px;border:none;cursor:pointer;text-decoration:none;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}

  .sheet-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(0,0,0,.12)}
  .send{width:100%;background:linear-gradient(135deg,var(--acc-lt),var(--accent));color:var(--acc-ink);border:none;cursor:pointer;border-radius:14px;padding:16px;font-size:16.5px;font-weight:800;box-shadow:0 8px 22px var(--glow)}

  .foot-note{text-align:center;font-size:11.5px;color:var(--muted);margin:9px 0 0}

  .frow{display:flex;gap:10px;font-size:14px;color:var(--ink);padding:6px 0;align-items:flex-start;line-height:1.4}

  .fcopy{text-align:center;font-size:12px;color:var(--muted);margin-top:18px;letter-spacing:.5px}
  @media (prefers-reduced-motion: reduce){.tray,.sheet,.overlay,.mark,.brand,.item{animation:none!important;transition:none!important;opacity:1!important;transform:none!important}}

</head>

<div class="wrap">
  <header>
    <div class="halal" id="halal">HALAL<br>100%</div>
    <div id="logoWrap"></div>
    <div class="brand" id="brandName"></div>
    <div class="brand-sub" id="brandSub"></div>

  <main id="menu"></main>
  <footer id="contacts">
    <div class="ftitle">Контакты</div>
    <div class="frow">📍 <span id="fAddr"></span></div>
    <div class="frow">🕒 <span id="fHours"></span></div>
    <a class="fbtn fcall" id="fPhone">📞 Позвонить</a>
    <a class="fbtn fmap" id="fMap" target="_blank" rel="noopener">🧭 Открыть в Яндекс.Картах</a>

    <div class="fcopy" id="fCopy"></div>
  </footer>
</div>
<div class="tray" id="tray"><button class="tray-btn" type="button" id="trayBtn" onclick="openSheet()">

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Ваш заказ">
  <div class="sheet-head"><h2 id="sheetTitle">Ваш заказ</h2><button class="close" type="button" onclick="closeSheet()" aria-label="Закрыть">×</button></div>
  <div class="sheet-scroll" id="sheetScroll">
    <div class="ticket" id="ticket"></div>
    <div id="formBlock">
      <div class="field" id="f-name"><label>Имя <span class="req">*</span></label><input id="inName" type="text" placeholder="Как вас зовут" autocomplete="name"></div>
      <div class="field" id="f-phone"><label>Телефон <span class="req">*</span></label><input id="inPhone" type="tel" inputmode="tel" placeholder="+7 ___ ___ __ __" autocomplete="tel"></div>
      <div class="field" id="f-addr"><label>Адрес доставки <span class="req">*</span></label><input id="inAddr" type="text" placeholder="Улица, дом, квартира" autocomplete="street-address"></div>
      <div class="field"><label>Комментарий</label><textarea id="inNote" placeholder="Без лука, позвонить за 10 минут"></textarea></div>
      <div class="err" id="errBox"></div>
    </div>
    <div id="resultBlock" style="display:none">
      <div class="done-h">✓ Заказ собран и скопирован</div>
      <p class="done-sub">Открой чат ресторана и вставь заказ (долгое нажатие → «Вставить»), затем отправь.</p>
      <div class="order-box" id="orderText"></div>
      <button class="copy-btn" type="button" id="copyBtn">📋 Скопировать ещё раз</button>
      <div class="ch-title">Открыть чат ресторана:</div><div class="channels" id="channels"></div>
    </div>
  </div>
  <div class="sheet-foot"><button class="send" id="mainBtn" type="button">Оформить заказ</button>
    <div class="foot-note" id="footNote">Соберём заказ и скопируем — останется вставить в чат</div></div>
</div>

function hx(h){h=(""+h).replace("#","");return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function toHex(a){return "#"+a.map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join("")}
function mix(hex,tgt,amt){const c=hx(hex);return toHex(c.map(x=>x+(tgt-x)*amt))}
function rgba(hex,a){const c=hx(hex);return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"}
function accInk(h){const c=hx(h);return (0.299*c[0]+0.587*c[1]+0.114*c[2])>150?"#1A1A1A":"#ffffff"}

function renderCtrl(id){const el=document.getElementById("ctrl-"+id);const q=cart[id]||0;

function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCtrl(id);updateTray();

function subtotal(){return Object.entries(cart).reduce((s,[id,q])=>s+byId[id].price*q,0)}
function count(){return Object.values(cart).reduce((s,q)=>s+q,0)}
function updateTray(){const n=count();document.getElementById("trayCount").textContent=n;document.getElementById("trayTotal").textContent=money(subtotal());document.getElementById("tray").classList.toggle("show",n>0)}

function renderTicket(){const t2=document.getElementById("ticket");const ids=Object.keys(cart);
  if(ids.length===0){t2.innerHTML='<div class="empty">Корзина пуста 🍕</div>';document.getElementById("formBlock").style.display="none";mainBtn.disabled=true;return}
  document.getElementById("formBlock").style.display="";mainBtn.disabled=false;
  let rows="";ids.forEach(id=>{const it=byId[id],q=cart[id];rows+='<div class="t-row"><span class="t-name"><span class="t-q">'+q+'×</span>'+it.name+'</span><span>'+money(it.price*q)+'</span><span class="t-mini"><button type="button" onclick="change(\''+id+'\',-1)">−</button><button type="button" onclick="change(\''+id+'\',1)">+</button></span></div>'});
  const sub=subtotal(),dlv=CONFIG.deliveryFee||0,total=sub+dlv;
  let sums='<div class="t-sum"><span>Сумма</span><span>'+money(sub)+'</span></div>';if(dlv>0)sums+='<div class="t-sum"><span>Доставка</span><span>'+money(dlv)+'</span></div>';
  sums+='<div class="t-total"><span>Итого</span><span>'+money(total)+'</span></div>';
  t2.innerHTML='<div class="t-total" style="font-size:13px;letter-spacing:1px;color:var(--acc-lt)">🧾 ВАШ ЗАКАЗ</div><hr class="tear">'+rows+'<hr class="tear">'+sums}
function buildOrderText(name,phone,addr,note){const sub=subtotal(),dlv=CONFIG.deliveryFee||0,total=sub+dlv;let lines=[];
  lines.push("🧾 НОВЫЙ ЗАКАЗ — "+CONFIG.name);lines.push("————————————");
  Object.keys(cart).forEach(id=>{const it=byId[id],q=cart[id];lines.push(q+"× "+it.name+" — "+money(it.price*q))});
  lines.push("————————————");lines.push("Сумма: "+money(sub));if(dlv>0)lines.push("Доставка: "+money(dlv));
  lines.push("ИТОГО: "+money(total));lines.push("");lines.push("👤 "+name);lines.push("📞 "+phone);lines.push("📍 "+addr);if(note)lines.push("💬 "+note);return lines.join("\n")}

function orderConfirm(){const name=document.getElementById("inName").value.trim();const phone=document.getElementById("inPhone").value.trim();

  if(CONFIG.minOrder>0&&sub<CONFIG.minOrder){err.textContent="Минимальный заказ — "+money(CONFIG.minOrder)+". Добавьте ещё на "+money(CONFIG.minOrder-sub)+".";err.classList.add("show");return}
  let bad=[];if(!name)bad.push("f-name");if(!phone)bad.push("f-phone");if(!addr)bad.push("f-addr");

  const text=buildOrderText(name,phone,addr,note);copyText(text);document.getElementById("orderText").textContent=text;renderChannels(text);
