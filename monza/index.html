<html lang="ru">
<head>

<title>MONZA PIZZA — меню</title>
<style>
  :root{
    --green:#0E2A22;--green2:#163A2E;--green3:#0A201A;--card:#163A2E;
    --gold:#C9A24B;--gold-soft:#E4CE94;--lime:#CBD64A;--cream:#F3EEE0;
    --muted:#9CB0A2;--red:#E0262C;--red-deep:#B81E23;
    --line:rgba(201,162,75,.22);--shadow:0 10px 34px rgba(0,0,0,.45);--col:600px;
    --max:#3A6DF0;--tg:#2AABEE;--wa:#25D366;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--green);color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.45;padding-bottom:122px}
  .wrap{max-width:var(--col);margin:0 auto;position:relative}
  header{position:relative;text-align:center;padding:30px 20px 22px;
    background:radial-gradient(120% 90% at 50% 0%, #1A4435 0%, var(--green3) 78%);
    border-bottom:1px solid var(--line)}
  .mark{margin:0 auto 6px;display:block}
  .brand{font-family:Georgia,"Times New Roman",serif;font-size:40px;font-weight:700;
    letter-spacing:6px;color:var(--gold);line-height:.9;margin-left:6px}
  .brand-sub{font-size:13px;letter-spacing:9px;color:var(--gold-soft);margin-top:6px}
  .brand-sub::before,.brand-sub::after{content:"—";margin:0 8px;color:var(--line)}
  .tagline{font-family:Georgia,serif;font-style:italic;font-size:14px;color:var(--gold-soft);margin-top:12px;opacity:.92}
  .tagline .h{color:var(--red);font-style:normal}
  .info{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--gold-soft)}
  .info span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  .halal{position:absolute;top:18px;right:18px;font-size:9px;letter-spacing:1px;color:var(--lime);
    border:1px solid var(--lime);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;text-align:center;line-height:1.1;opacity:.85}
  nav{position:sticky;top:0;z-index:30;background:rgba(10,32,26,.96);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .cats{display:flex;gap:8px;padding:12px 20px;width:max-content}
  .cat{border:1.5px solid var(--line);background:transparent;color:var(--gold-soft);font-size:13.5px;font-weight:700;
    padding:8px 16px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:.15s}
  .cat.active{background:var(--gold);border-color:var(--gold);color:#14271F}
  section{padding:24px 20px 4px;scroll-margin-top:62px}
  .sec-title{font-size:18px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--lime);margin:0 0 16px;
    display:flex;align-items:center;gap:12px}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:11px;
    display:flex;gap:13px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .item-img{width:66px;height:66px;border-radius:12px;object-fit:cover;flex:none}
  .item-ph{width:66px;height:66px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--green3);border:1px solid var(--line)}
  .item-body{flex:1;min-width:0}
  .item-name{font-size:15.5px;font-weight:700;margin:0;color:var(--cream)}
  .item-desc{font-size:12.5px;color:var(--muted);margin:4px 0 0;line-height:1.35}
  .item-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .price{font-weight:800;font-size:13.5px;background:var(--red);color:#fff;padding:5px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(224,38,44,.35)}
  .add{width:40px;height:40px;border-radius:12px;border:none;cursor:pointer;background:var(--gold);color:#14271F;font-size:24px;font-weight:700;display:grid;place-items:center;line-height:1;transition:.12s}
  .add:active{transform:scale(.92);background:var(--gold-soft)}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--gold);border-radius:12px;overflow:hidden}
  .stepper button{width:34px;height:40px;border:none;background:transparent;color:var(--gold);font-size:20px;font-weight:700;cursor:pointer}
  .stepper .q{min-width:28px;text-align:center;font-weight:800;font-size:15px;color:var(--cream)}
  .tray{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:var(--col);margin:0 auto;padding:0 14px 14px;transform:translateY(140%);transition:transform .25s ease}
  .tray.show{transform:translateY(0)}
  .tray-btn{width:100%;background:var(--gold);color:#14271F;border:none;cursor:pointer;border-radius:16px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);font-size:16px;font-weight:700}
  .tray-left{display:flex;align-items:center;gap:10px}
  .tray-count{background:#14271F;color:var(--gold);font-weight:800;font-size:13px;min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
  .tray-total{font-weight:800}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:.2s}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:var(--col);margin:0 auto;background:var(--green);
    border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;border-top:2px solid var(--gold);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .sheet.show{transform:translateY(0)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
  .sheet-head h2{margin:0;font-size:19px;font-weight:800;color:var(--gold)}
  .close{background:none;border:none;font-size:26px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
  .sheet-scroll{overflow-y:auto;padding:0 20px;flex:1}
  .ticket{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:16px;margin-bottom:16px}
  .tear{border:none;border-top:1px dashed var(--line);margin:12px 0}
  .t-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:7px 0}
  .t-row .t-name{flex:1}
  .t-row .t-q{color:var(--gold);font-weight:800;margin-right:8px}
  .t-mini{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:8px}
  .t-mini button{width:28px;height:28px;border:none;background:var(--green3);color:var(--gold);font-weight:700;cursor:pointer;font-size:16px}
  .t-sum{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:3px 0}
  .t-total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding-top:6px;color:var(--cream)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:15px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--gold-soft)}
  .field .req{color:var(--red)}
  .field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;background:var(--green3);color:var(--cream);transition:.15s}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
  .field textarea{resize:vertical;min-height:60px}
  .field.invalid input{border-color:var(--red);background:#2a1614}
  .err{color:var(--red);font-size:13px;margin:8px 0 2px;display:none;font-weight:600}
  .err.show{display:block}
  .done-h{font-size:18px;font-weight:800;margin:4px 0 2px;color:var(--lime)}
  .done-sub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
  .order-box{background:var(--green3);border:1px dashed var(--line);border-radius:12px;padding:14px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;color:var(--cream);margin-bottom:10px}
  .copy-btn{width:100%;background:transparent;color:var(--gold);border:1.5px solid var(--gold);border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:16px}
  .ch-title{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .channels{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
  .ch{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:12px;font-weight:800;font-size:15px;border:none;cursor:pointer;text-decoration:none;color:#fff}
  .ch-max{background:var(--max)}.ch-tg{background:var(--tg)}.ch-wa{background:var(--wa)}
  .sheet-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--green)}
  .send{width:100%;background:var(--gold);color:#14271F;border:none;cursor:pointer;border-radius:14px;padding:16px;font-size:16.5px;font-weight:800}
  .send:active{background:var(--gold-soft)}
  .send:disabled{background:#3a4a40;color:#7a8a7e;cursor:not-allowed}
  .foot-note{text-align:center;font-size:11.5px;color:var(--muted);margin:9px 0 0}
  @media (prefers-reduced-motion: reduce){.tray,.sheet,.overlay{transition:none}}
</style>
</head>

      <div class="channels" id="channels"></div>
    </div>

  hotdog:'<svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="'+G+'" stroke-width="2" stroke-linecap="round"><rect x="9" y="20" width="30" height="9" rx="4.5"/><path d="M14 24h20" stroke-dasharray="2 3"/></svg>',
  snack:'<svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="'+G+'" stroke-width="2" stroke-linecap="round"><path d="M30 12a8 8 0 0 0-11 11l-8 8a3 3 0 1 0 4 4l8-8a8 8 0 0 0 11-11"/></svg>',
  fries:'<svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="'+G+'" stroke-width="2" stroke-linecap="round"><path d="M15 24h18l-2 15H17z"/><line x1="19" y1="13" x2="19" y2="24"/><line x1="24" y1="10" x2="24" y2="24"/><line x1="29" y1="13" x2="29" y2="24"/></svg>'
};
function catIcon(cat){const c=(cat||"").toLowerCase();
  if(c.indexOf("пицц")>=0)return ICONS.pizza;
  if(c.indexOf("бургер")>=0)return ICONS.burger;
  if(c.indexOf("хот")>=0)return ICONS.hotdog;
  if(c.indexOf("картоф")>=0)return ICONS.fries;
  return ICONS.snack;}

const cart={};const byId={};
MENU.forEach(s=>s.items.forEach(i=>byId[i.id]=i));
const cur=CONFIG.currency;const money=n=>n.toLocaleString("ru-RU")+" "+cur;
const mainBtn=document.getElementById("mainBtn");
document.getElementById("infoTime").textContent="⏱ "+CONFIG.workTime;
document.getElementById("infoDelivery").textContent=CONFIG.deliveryFee>0?"🛵 Доставка "+money(CONFIG.deliveryFee):"🛵 Доставка бесплатно";
const minEl=document.getElementById("infoMin");
if(CONFIG.minOrder>0){minEl.textContent="🧾 Минимум "+money(CONFIG.minOrder)}else{minEl.style.display="none"}
const catsEl=document.getElementById("cats");
MENU.forEach((s,idx)=>{const b=document.createElement("button");b.className="cat"+(idx===0?" active":"");
  b.textContent=s.cat;b.onclick=()=>{document.getElementById("sec-"+idx).scrollIntoView({behavior:"smooth",block:"start"})};catsEl.appendChild(b)});
const menuEl=document.getElementById("menu");
MENU.forEach((s,idx)=>{const sec=document.createElement("section");sec.id="sec-"+idx;
  sec.innerHTML='<h2 class="sec-title">'+s.cat+'</h2>';
  s.items.forEach(it=>{const row=document.createElement("div");row.className="item";
    row.innerHTML=(it.img?'<img class="item-img" src="'+it.img+'" alt="">':'<div class="item-ph">'+catIcon(s.cat)+'</div>')+
      '<div class="item-body"><p class="item-name">'+it.name+'</p>'+(it.desc?'<p class="item-desc">'+it.desc+'</p>':'')+'</div>'+
      '<div class="item-side"><span class="price">'+money(it.price)+'</span><div id="ctrl-'+it.id+'"></div></div>';
    sec.appendChild(row);menuEl.appendChild(sec)})});
const catBtns=[...catsEl.children];
const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const i=+e.target.id.split("-")[1];
  catBtns.forEach((b,k)=>b.classList.toggle("active",k===i))}})},{rootMargin:"-55% 0px -42% 0px"});
MENU.forEach((s,idx)=>obs.observe(document.getElementById("sec-"+idx)));
function renderCtrl(id){const el=document.getElementById("ctrl-"+id);const q=cart[id]||0;
  if(q===0){el.innerHTML='<button class="add" type="button" aria-label="Добавить">+</button>';el.firstChild.onclick=()=>change(id,1)}
  else{el.innerHTML='<div class="stepper"><button type="button" aria-label="Убрать">−</button><span class="q">'+q+'</span><button type="button" aria-label="Добавить">+</button></div>';
    const m=el.firstChild.children[0],p=el.firstChild.children[2];m.onclick=()=>change(id,-1);p.onclick=()=>change(id,1)}}
MENU.forEach(s=>s.items.forEach(i=>renderCtrl(i.id)));
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCtrl(id);updateTray();
  if(document.getElementById("sheet").classList.contains("show")&&document.getElementById("resultBlock").style.display==="none")renderTicket()}
function subtotal(){return Object.entries(cart).reduce((s,[id,q])=>s+byId[id].price*q,0)}
function count(){return Object.values(cart).reduce((s,q)=>s+q,0)}
function updateTray(){const n=count();document.getElementById("trayCount").textContent=n;
  document.getElementById("trayTotal").textContent=money(subtotal());document.getElementById("tray").classList.toggle("show",n>0)}
function openSheet(){backToCart();renderTicket();document.getElementById("overlay").classList.add("show");
  document.getElementById("sheet").classList.add("show");document.body.style.overflow="hidden"}
function closeSheet(){document.getElementById("overlay").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");document.body.style.overflow=""}
function renderTicket(){const t=document.getElementById("ticket");const ids=Object.keys(cart);
  if(ids.length===0){t.innerHTML='<div class="empty">Корзина пуста.<br>Выбери что-нибудь вкусное 🍕</div>';
    document.getElementById("formBlock").style.display="none";mainBtn.disabled=true;return}
  document.getElementById("formBlock").style.display="";mainBtn.disabled=false;
  let rows="";ids.forEach(id=>{const it=byId[id],q=cart[id];
    rows+='<div class="t-row"><span class="t-name"><span class="t-q">'+q+'×</span>'+it.name+'</span>'+
      '<span>'+money(it.price*q)+'</span><span class="t-mini"><button type="button" onclick="change(\''+id+'\',-1)">−</button>'+
      '<button type="button" onclick="change(\''+id+'\',1)">+</button></span></div>'});
  const sub=subtotal(),dlv=CONFIG.deliveryFee||0,total=sub+dlv;
  let sums='<div class="t-sum"><span>Сумма</span><span>'+money(sub)+'</span></div>';
  if(dlv>0)sums+='<div class="t-sum"><span>Доставка</span><span>'+money(dlv)+'</span></div>';
  sums+='<div class="t-total"><span>Итого</span><span>'+money(total)+'</span></div>';
  t.innerHTML='<div class="t-total" style="font-size:13px;letter-spacing:1px;color:var(--lime)">🧾 ВАШ ЗАКАЗ</div><hr class="tear">'+rows+'<hr class="tear">'+sums}
function buildOrderText(name,phone,addr,note){
  const sub=subtotal(),dlv=CONFIG.deliveryFee||0,total=sub+dlv;let lines=[];
  lines.push("🍕 НОВЫЙ ЗАКАЗ — "+CONFIG.name);lines.push("————————————");
  Object.keys(cart).forEach(id=>{const it=byId[id],q=cart[id];lines.push(q+"× "+it.name+" — "+money(it.price*q))});
  lines.push("————————————");lines.push("Сумма: "+money(sub));
  if(dlv>0)lines.push("Доставка: "+money(dlv));lines.push("ИТОГО: "+money(total));lines.push("");
  lines.push("👤 "+name);lines.push("📞 "+phone);lines.push("📍 "+addr);if(note)lines.push("💬 "+note);
  return lines.join("\n");
}
function copyText(t){try{navigator.clipboard.writeText(t)}catch(e){
  const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy")}catch(_){}document.body.removeChild(ta)}}
function renderChannels(text){
  const c=document.getElementById("channels");c.innerHTML="";const enc=encodeURIComponent(text);
  if(CONFIG.max){const a=document.createElement("a");a.className="ch ch-max";a.href=CONFIG.max;a.target="_blank";a.rel="noopener";a.textContent="Открыть МАКС";c.appendChild(a)}
  if(CONFIG.telegram){const u=CONFIG.telegram.replace(/^@/,"");const a=document.createElement("a");a.className="ch ch-tg";a.href="https://t.me/"+u;a.target="_blank";a.rel="noopener";a.textContent="Открыть Telegram";c.appendChild(a)}
  if(CONFIG.whatsapp){const a=document.createElement("a");a.className="ch ch-wa";a.href="https://wa.me/"+CONFIG.whatsapp+"?text="+enc;a.target="_blank";a.rel="noopener";a.textContent="Открыть WhatsApp";c.appendChild(a)}
}
function orderConfirm(){
  const name=document.getElementById("inName").value.trim();const phone=document.getElementById("inPhone").value.trim();
  const addr=document.getElementById("inAddr").value.trim();const note=document.getElementById("inNote").value.trim();
  ["f-name","f-phone","f-addr"].forEach(f=>document.getElementById(f).classList.remove("invalid"));
  const err=document.getElementById("errBox");err.classList.remove("show");const sub=subtotal();if(sub===0)return;
  if(CONFIG.minOrder>0&&sub<CONFIG.minOrder){err.textContent="Минимальный заказ — "+money(CONFIG.minOrder)+". Добавьте ещё на "+money(CONFIG.minOrder-sub)+".";err.classList.add("show");return}
  let bad=[];if(!name)bad.push("f-name");if(!phone)bad.push("f-phone");if(!addr)bad.push("f-addr");
  if(bad.length){bad.forEach(f=>document.getElementById(f).classList.add("invalid"));
    err.textContent="Заполните имя, телефон и адрес доставки.";err.classList.add("show");
    document.getElementById(bad[0]).scrollIntoView({behavior:"smooth",block:"center"});return}
  const text=buildOrderText(name,phone,addr,note);
  copyText(text);
  document.getElementById("orderText").textContent=text;
  renderChannels(text);
  document.getElementById("ticket").style.display="none";
  document.getElementById("formBlock").style.display="none";
  document.getElementById("resultBlock").style.display="";
  document.getElementById("sheetTitle").textContent="Заказ готов";
  document.getElementById("footNote").textContent="Скопировано. Вставь в чат ресторана и отправь.";
  mainBtn.textContent="← Изменить заказ";mainBtn.onclick=backToCart;
  document.getElementById("sheetScroll").scrollTop=0;
}
function backToCart(){
  document.getElementById("resultBlock").style.display="none";
  document.getElementById("ticket").style.display="";
  document.getElementById("sheetTitle").textContent="Ваш заказ";
  document.getElementById("footNote").textContent="Соберём заказ и скопируем — останется вставить в чат ресторана";
  mainBtn.textContent="Оформить заказ";mainBtn.onclick=orderConfirm;
  renderTicket();
}
document.getElementById("copyBtn").onclick=()=>copyText(document.getElementById("orderText").textContent);
mainBtn.onclick=orderConfirm;
updateTray();
</script>
</body>
</html>
