<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор меню</title>
<style>
  :root{--bg:#F4F1EC;--card:#fff;--ink:#1C1714;--muted:#7A6F64;--accent:#E0341E;--line:#E2D8C9;--ok:#1EBE5A;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.4}
  .top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .top h1{font-size:17px;margin:0;font-weight:800}.top .saved{font-size:12px;color:#9c9189}.top .who{font-size:12px;color:#C9A36F;font-weight:700;margin-top:2px}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 150px}
  .block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .block h2{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
  .sub{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
  .hint{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:4px}
  input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  input[type=color]{padding:4px;height:44px;cursor:pointer}
  .chk{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;padding:9px 0;cursor:pointer}.chk input{width:20px;height:20px;flex:none}
  textarea{resize:vertical;min-height:48px}
  .cat{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#FBF8F3}
  .cat-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}.cat-head input{font-weight:700}
  .item{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;align-items:stretch}
  .thumb{width:60px;height:60px;flex:none;border-radius:10px;border:1.5px dashed var(--line);background:#fff center/cover no-repeat;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--muted);font-size:22px}
  .thumb.has{border-style:solid}
  .thumb-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:var(--accent);color:#fff;font-size:11px;cursor:pointer;display:grid;place-items:center;line-height:1;padding:0}
  .item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .item-body input{padding:9px 10px;font-size:14px}
  .pricing{display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .srow{display:flex;gap:6px;align-items:center}
  .srow input.price{width:82px;flex:none}.srow input.lbl{flex:1}
  .linkbtn{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;text-align:left;padding:3px 2px;width:max-content}
  .item-ctrls{display:flex;flex-direction:column;gap:5px;justify-content:center}
  .ib{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:15px;color:var(--muted);display:grid;place-items:center;flex:none}
  .ib:hover{border-color:var(--accent);color:var(--accent)}.ib.del:hover{background:#fdeeec}
  .addbtn{background:none;border:1.5px dashed var(--line);color:var(--muted);border-radius:10px;padding:9px;width:100%;cursor:pointer;font-size:13.5px;font-weight:600}
  .addbtn:hover{border-color:var(--accent);color:var(--accent)}
  .reset{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;z-index:20}
  .bar-in{max-width:760px;margin:0 auto}
  .msg{font-size:13px;font-weight:600;margin:0 0 8px;display:none;text-align:center}
  .msg.show{display:block}.msg.err{color:var(--accent)}.msg.ok{color:#1a9d4d}
  .btns{display:flex;gap:10px}.btn{border:none;border-radius:11px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;flex:1}
  .btn-2{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:700}.btn-main{background:var(--ok);color:#fff}
</style>
</head>
<body>
<div class="top"><div><h1>🍔 Редактор меню</h1><div class="who" id="who"></div></div><span class="saved" id="saved">сохраняется автоматически</span></div>
<div class="wrap">
  <div class="block">
    <h2>Ресторан</h2>
    <div class="grid">
      <div><label>Название</label><input id="c_name" placeholder="MONZA"></div>
      <div><label>Подпись бренда</label><input id="c_sub" placeholder="PIZZA"><div class="hint">маленькая строка под названием</div></div>
      <div><label>Слоган</label><input id="c_tagline" placeholder="Вкус, который объединяет"></div>
      <div><label>Время доставки</label><input id="c_time" placeholder="40–60 мин"></div>
      <div><label>Валюта</label><input id="c_cur" placeholder="₽"></div>
      <div><label>Стоимость доставки</label><input id="c_dlv" inputmode="numeric" placeholder="0"><div class="hint">0 = бесплатно</div></div>
      <div><label>Минимальный заказ</label><input id="c_min" inputmode="numeric" placeholder="0"><div class="hint">0 = без минимума</div></div>
    </div>
    <div class="sub">Оформление</div>
    <div class="grid">
      <div><label>Тема</label><select id="c_theme"><option value="light">Светлая</option><option value="dark">Тёмная</option></select></div>
      <div><label>Цвет фона (тёмная тема)</label><input id="c_bg" type="color"></div>
      <div><label>Фирменный цвет</label><input id="c_accent" type="color"></div>
      <div><label>Цвет ценника</label><input id="c_price" type="color"></div>
    </div>
    <label class="chk"><input type="checkbox" id="c_logo"> Логотип-пицца над названием</label>
    <label class="chk"><input type="checkbox" id="c_serif"> Шрифт с засечками (элегантный)</label>
    <label class="chk"><input type="checkbox" id="c_halal"> Бейдж HALAL</label>
    <div class="sub">Контакты (блок внизу сайта)</div>
    <div class="grid">
      <div><label>Телефон</label><input id="c_phone" placeholder="+7 999 123-45-67"></div>
      <div><label>Часы работы</label><input id="c_hours" placeholder="Ежедневно 10:00–23:00"></div>
    </div>
    <div style="margin-top:12px"><label>Адрес</label><input id="c_addr" placeholder="г. Москва, ул. Примерная, 1"></div>
    <div style="margin-top:12px"><label>Ссылка Яндекс.Карты</label><input id="c_yx" placeholder="https://yandex.ru/maps/org/..."></div>
    <div class="sub">Каналы заказа (хотя бы один)</div>
    <div style="margin-bottom:12px"><label>Ссылка МАКС</label><input id="c_max" placeholder="https://max.ru/u/...">
      <div class="hint">В МАКС: Настройки → значок QR → Поделиться → копировать ссылку</div></div>
    <div class="grid">
      <div><label>Telegram (username)</label><input id="c_tg" placeholder="monza_pizza"></div>
      <div><label>WhatsApp (номер)</label><input id="c_wa" inputmode="numeric" placeholder="79991234567"></div>
    </div>
  </div>
  <div class="block">
    <h2>Меню</h2><div id="cats"></div>
    <button class="addbtn" type="button" onclick="addCat()">+ Добавить категорию</button>
    <button class="reset" type="button" onclick="resetAll()">Очистить и начать заново</button>
  </div>
</div>
<div class="bar"><div class="bar-in"><p class="msg" id="msg"></p>
  <div class="btns"><button class="btn btn-2" type="button" onclick="preview()">👁 Предпросмотр</button>
  <button class="btn btn-main" type="button" onclick="download()">⬇ Сохранить меню</button></div></div></div>

<script>
const PARAMS=new URLSearchParams(location.search);
const RID=(PARAMS.get("r")||"").replace(/[^a-z0-9_-]/gi,"");
const PNAME=PARAMS.get("name")||"";const PWA=(PARAMS.get("wa")||"").replace(/\D/g,"");
const KEY="menuAdminDraft"+(RID?"_"+RID:"");
let draft=null,C=null;
function defConfig(){return {name:PNAME||RID||"MONZA",sub:"PIZZA",tagline:"Вкус, который объединяет",
  theme:"dark",bg:"#0E2A22",accent:"#C9A24B",priceColor:"#E23A35",logo:true,serif:true,halal:true,
  currency:"₽",deliveryFee:0,minOrder:0,workTime:"40–60 мин",
  phone:"",address:"",openHours:"",yandex:"",max:"",telegram:"",whatsapp:PWA}}
function DEFAULT_DRAFT(){return {config:defConfig(),
  menu:[{cat:"Пицца",items:[{id:nid(),name:"Пепперони",desc:"Томатный соус, моцарелла, пепперони",img:"",sizes:[{label:"25 см",price:580},{label:"35 см",price:780}]}]}]}}
function nid(){return "i"+Math.random().toString(36).slice(2,8)}
function el(t,c){const e=document.createElement(t);if(c)e.className=c;return e}
function toInt(v){return parseInt((""+v).replace(/\D/g,""))||0}
function save(){try{localStorage.setItem(KEY,JSON.stringify(draft));flash("✓ сохранено")}catch(e){flash("⚠ много фото — сохрани меню кнопкой ниже")}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let flashT;function flash(t){const s=document.getElementById("saved");s.textContent=t;clearTimeout(flashT);flashT=setTimeout(()=>s.textContent="сохраняется автоматически",1500)}

const TEXTKEYS=[["c_name","name"],["c_sub","sub"],["c_tagline","tagline"],["c_theme","theme"],["c_bg","bg"],
 ["c_accent","accent"],["c_price","priceColor"],["c_time","workTime"],["c_cur","currency"],
 ["c_dlv","deliveryFee"],["c_min","minOrder"],["c_phone","phone"],["c_addr","address"],["c_hours","openHours"],["c_yx","yandex"],
 ["c_max","max"],["c_tg","telegram"],["c_wa","whatsapp"]];
const CHKKEYS=[["c_logo","logo"],["c_serif","serif"],["c_halal","halal"]];
function bindConfig(){C=draft.config;
  TEXTKEYS.forEach(([id,k])=>{const node=document.getElementById(id);node.value=C[k]??"";
    node.oninput=()=>{let v=node.value;
      if(k==="deliveryFee"||k==="minOrder"){v=parseInt(v.replace(/\D/g,""))||0}
      if(k==="whatsapp"){v=v.replace(/\D/g,"");node.value=v}
      C[k]=v;save()};});
  CHKKEYS.forEach(([id,k])=>{const node=document.getElementById(id);node.checked=!!C[k];node.onchange=()=>{C[k]=node.checked;save()};});}

function resizeImage(file,max,q,cb){const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;
    if(w>h){if(w>max){h=Math.round(h*max/w);w=max}}else{if(h>max){w=Math.round(w*max/h);h=max}}
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
    cb(cv.toDataURL("image/jpeg",q))};img.src=fr.result};fr.readAsDataURL(file);}

const catsEl=document.getElementById("cats");
function mkInput(val,ph,on,cls){const i=el("input",cls);i.value=val??"";i.placeholder=ph;i.oninput=()=>on(i.value);return i}
function ib(txt,on,cls){const b=el("button","ib"+(cls?" "+cls:""));b.type="button";b.textContent=txt;b.onclick=on;return b}
function render(){catsEl.innerHTML="";
  draft.menu.forEach((cat,ci)=>{const box=el("div","cat");
    const head=el("div","cat-head");
    const cin=el("input");cin.value=cat.cat;cin.placeholder="Категория";cin.oninput=()=>{cat.cat=cin.value;save()};head.appendChild(cin);
    head.appendChild(ib("↑",()=>moveCat(ci,-1)));head.appendChild(ib("↓",()=>moveCat(ci,1)));
    head.appendChild(ib("✕",()=>{if(confirm("Удалить категорию?")){draft.menu.splice(ci,1);save();render()}},"del"));box.appendChild(head);
    cat.items.forEach((it,ii)=>{const row=el("div","item");
      const photo=el("div","thumb"+(it.img?" has":""));
      if(it.img){photo.style.backgroundImage="url("+it.img+")";const x=el("button","thumb-x");x.type="button";x.textContent="✕";x.onclick=(e)=>{e.stopPropagation();it.img="";save();render()};photo.appendChild(x)}
      else{photo.innerHTML="<span>📷</span>"}
      photo.onclick=()=>{const fin=el("input");fin.type="file";fin.accept="image/*";fin.onchange=()=>{if(fin.files[0])resizeImage(fin.files[0],600,.72,d=>{it.img=d;save();render()})};fin.click()};
      const body=el("div","item-body");
      body.appendChild(mkInput(it.name,"Название блюда",v=>{it.name=v;save()}));
      body.appendChild(mkInput(it.desc,"Описание (необязательно)",v=>{it.desc=v;save()}));
      const pricing=el("div","pricing");
      if(it.sizes&&it.sizes.length){
        it.sizes.forEach((sz,si)=>{const sr=el("div","srow");
          sr.appendChild(mkInput(sz.label,"Размер (25 см / 6 шт)",v=>{sz.label=v;save()},"lbl"));
          sr.appendChild(mkInput(sz.price,"Цена",v=>{sz.price=toInt(v);save()},"price"));
          sr.appendChild(ib("✕",()=>{it.sizes.splice(si,1);if(!it.sizes.length){delete it.sizes;it.price=0}save();render()},"del"));
          pricing.appendChild(sr)});
        const a=el("button","linkbtn");a.type="button";a.textContent="+ добавить размер";a.onclick=()=>{it.sizes.push({label:"",price:0});save();render()};pricing.appendChild(a);
        const s1=el("button","linkbtn");s1.type="button";s1.textContent="← одна цена без размеров";s1.onclick=()=>{delete it.sizes;it.price=0;save();render()};pricing.appendChild(s1);
      }else{
        const sr=el("div","srow");
        sr.appendChild(mkInput(it.price,"Цена",v=>{it.price=toInt(v);save()},"price"));
        const a=el("button","linkbtn");a.type="button";a.textContent="+ размеры (25/35 см, шт…)";a.onclick=()=>{it.sizes=[{label:"25 см",price:it.price||0},{label:"35 см",price:0}];delete it.price;save();render()};sr.appendChild(a);
        pricing.appendChild(sr);
      }
      body.appendChild(pricing);
      const ctrls=el("div","item-ctrls");
      ctrls.appendChild(ib("↑",()=>moveItem(ci,ii,-1)));ctrls.appendChild(ib("↓",()=>moveItem(ci,ii,1)));
      ctrls.appendChild(ib("✕",()=>{cat.items.splice(ii,1);save();render()},"del"));
      row.appendChild(photo);row.appendChild(body);row.appendChild(ctrls);box.appendChild(row)});
    const add=el("button","addbtn");add.type="button";add.textContent="+ блюдо";
    add.onclick=()=>{cat.items.push({id:nid(),name:"",desc:"",price:0,img:""});save();render()};box.appendChild(add);catsEl.appendChild(box)});}
function moveCat(i,dir){const j=i+dir;if(j<0||j>=draft.menu.length)return;[draft.menu[i],draft.menu[j]]=[draft.menu[j],draft.menu[i]];save();render()}
function moveItem(ci,i,dir){const arr=draft.menu[ci].items;const j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();render()}
function addCat(){draft.menu.push({cat:"Новая категория",items:[{id:nid(),name:"",desc:"",price:0,img:""}]});save();render()}
function resetAll(){if(confirm("Стереть всё?")){localStorage.removeItem(KEY);location.reload()}}

async function fetchMenu(rid){try{const res=await fetch(rid+"/index.html",{cache:"no-store"});if(!res.ok)return null;
  const html=await res.text();let de=html.indexOf("/*DATA_END*/");if(de<0)de=html.indexOf("function hx(");if(de<0)de=html.indexOf("const cart={}");
  const cs=html.indexOf("const CONFIG = "),ms=html.indexOf("const MENU = ");if(cs<0||ms<0||de<0)return null;
  const cfg=JSON.parse(html.slice(cs+15,ms).trim().replace(/;$/,""));
  const menu=JSON.parse(html.slice(ms+13,de).trim().replace(/;$/,""));
  menu.forEach(c=>c.items.forEach(i=>{if(!i.id)i.id=nid();if(i.img===undefined)i.img=""}));
  return {config:Object.assign(defConfig(),cfg),menu}}catch(e){return null}}
async function init(){document.getElementById("who").textContent=RID?("Меню: "+RID):"Новое меню";
  const saved=load();
  if(saved){draft=saved;draft.config=Object.assign(defConfig(),draft.config)}
  else if(RID){const m=await fetchMenu(RID);draft=m||DEFAULT_DRAFT();if(!m)flash("начните с нуля и сохраните меню")}
  else{draft=DEFAULT_DRAFT()}
  bindConfig();render();}

function showMsg(t,ok){const m=document.getElementById("msg");m.textContent=t;m.className="msg show "+(ok?"ok":"err");setTimeout(()=>m.classList.remove("show"),4000)}
function itemValid(i){if(!i.name.trim())return false;if(i.sizes&&i.sizes.length)return i.sizes.some(s=>s.label.trim()&&s.price>0);return i.price>0}
function validate(){if(!C.name.trim()){showMsg("Укажите название");return false}
  if(!C.max.trim()&&!C.telegram.trim()&&C.whatsapp.replace(/\D/g,"").length<10){showMsg("Заполните хотя бы один канал: МАКС, Telegram или WhatsApp");return false}
  if(!draft.menu.some(c=>c.items.some(itemValid))){showMsg("Добавьте хотя бы одно блюдо с ценой");return false}return true}
function cleanData(){
  const menu=draft.menu.map(c=>({cat:c.cat.trim(),items:c.items.filter(itemValid).map(i=>{
    const base={id:i.id,name:i.name.trim(),desc:(i.desc||"").trim(),img:i.img||""};
    if(i.sizes&&i.sizes.length){const sizes=i.sizes.filter(s=>s.label.trim()&&s.price>0).map(s=>({label:s.label.trim(),price:s.price}));base.sizes=sizes}
    else{base.price=i.price}
    return base})})).filter(c=>c.cat&&c.items.length);
  const config={name:C.name.trim(),sub:(C.sub||"").trim(),tagline:(C.tagline||"").trim(),theme:C.theme||"light",
    bg:C.bg||"#0E2A22",accent:C.accent||"#E0341E",priceColor:C.priceColor||C.accent||"#E0341E",
    logo:!!C.logo,serif:!!C.serif,halal:!!C.halal,currency:(C.currency||"₽").trim()||"₽",
    deliveryFee:C.deliveryFee||0,minOrder:C.minOrder||0,workTime:(C.workTime||"").trim()||"30–45 мин",
    phone:(C.phone||"").trim(),address:(C.address||"").trim(),openHours:(C.openHours||"").trim(),yandex:(C.yandex||"").trim(),
    max:(C.max||"").trim(),telegram:(C.telegram||"").replace(/^@/,"").trim(),whatsapp:(C.whatsapp||"").replace(/\D/g,"")};
  return {config,menu}}
function buildHTML(){const {config,menu}=cleanData();
  const data="const CONFIG = "+JSON.stringify(config,null,2)+";\n\nconst MENU = "+JSON.stringify(menu,null,2)+";";
  return APP_TEMPLATE.replace("__DATA__",data)}
function preview(){if(!validate())return;const b=new Blob([buildHTML()],{type:"text/html"});window.open(URL.createObjectURL(b),"_blank")}
function download(){if(!validate())return;const b=new Blob([buildHTML()],{type:"text/html"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="index.html";a.click();
  showMsg("Готово! Залей index.html в папку ресторана на GitHub.",true)}

const APP_TEMPLATE = `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Меню</title>
<style>
  :root{--bg:#FBF7F1;--bg2:#fff;--card:#fff;--card2:#fff;--ink:#1C1714;--muted:#7A6F64;--line:#E7DDCD;--ph:#FBEFE2;--glow:rgba(224,52,30,.08);
    --accent:#E0341E;--acc-lt:#F09080;--acc-dk:#A82414;--acc-ink:#fff;--price:#E0341E;--price-dk:#A82414;--price-ink:#fff;
    --brand-grad:linear-gradient(95deg,#A82414,#F09080,#E0341E,#F09080,#A82414);--shadow:0 14px 40px rgba(0,0,0,.45);--col:600px;--max:#3A6DF0;--tg:#2AABEE;--wa:#25D366;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.45;padding-bottom:124px;
    background:radial-gradient(130% 70% at 50% -8%,var(--glow),transparent 58%),linear-gradient(var(--bg2),var(--bg)) fixed;background-color:var(--bg)}
  .wrap{max-width:var(--col);margin:0 auto;position:relative}
  header{position:relative;text-align:center;padding:32px 20px 24px;overflow:hidden}
  header::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:78%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
  .mark{margin:0 auto 8px;display:none;filter:drop-shadow(0 4px 14px var(--glow));animation:floaty 5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .brand{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.05;background:var(--brand-grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6.5s linear infinite}

<script>

function hx(h){h=(""+h).replace("#","");return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}

function mix(hex,tgt,amt){const c=hx(hex);return toHex(c.map(x=>x+(tgt-x)*amt))}

function accInk(h){const c=hx(h);return (0.299*c[0]+0.587*c[1]+0.114*c[2])>150?"#1A1A1A":"#ffffff"}

  pizza:'<svg width="42" height="42" viewBox="0 0 48 48" fill="none" stroke="'+G+'" stroke-width="2"><path d="M24 6l16 31c-10 5-22 5-32 0L24 6z"/><circle cx="20" cy="25" r="2" fill="'+G+'" stroke="none"/><circle cx="28" cy="28" r="2" fill="'+G+'" stroke="none"/></svg>',

function renderCtrl(key){const el=document.getElementById("ctrl-"+key);if(!el)return;const q=cart[key]||0;

function buildOrderText(name,phone,addr,note){const sub=subtotal(),dlv=DLVFEE,total=sub+dlv;let lines=[];
